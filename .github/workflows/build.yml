name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  shared-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate source coverage and generated curriculum
        run: |
          python -m pip install sympy==1.12
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/check_calculus_math.py
          python tools/check_linear_algebra_math.py
          python tools/check_missing_semester_scenarios.py
          python tools/check_intro_python.py
          python tools/check_discrete_math.py
          python tools/check_computation_theory.py
          python tools/validate_curriculum.py --generate
          git diff --exit-code -- composeApp/src/commonMain/kotlin/com/duolingo/app/data/generated/ docs/curriculum/AUTHORED-COVERAGE.md
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Test shared logic and build Android APK
        run: gradle :composeApp:desktopTest :composeApp:lintDebug :composeApp:assembleDebug --stacktrace
      - name: Verify audio in the actual APK
        run: python tools/verify_bundled_audio.py --apk composeApp/build/outputs/apk/debug/composeApp-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: DuolingoKmpApp-Android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch real Android app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/smoke-android.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Android-checks
          path: |
            composeApp/build/reports/
            composeApp/build/test-results/
            build/android-evidence/
          retention-days: 14

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Test and build Windows app image
        run: gradle :composeApp:desktopTest :composeApp:createDistributable --stacktrace
      - name: Prepare Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = Get-ChildItem 'composeApp/build/compose/binaries' -Filter 'DuolingoKmpApp.exe' -File -Recurse | Select-Object -First 1
          if (-not $launcher) { throw 'Windows app launcher was not produced.' }
          python tools/verify_bundled_audio.py --desktop-dir $launcher.Directory.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Bundled audio verification failed.' }
          Compress-Archive -Path (Join-Path $launcher.Directory.FullName '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'DuolingoKmpApp-Windows.zip')
      - uses: actions/upload-artifact@v7
        with:
          name: DuolingoKmpApp-Windows
          path: ${{ runner.temp }}\DuolingoKmpApp-Windows.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Windows-checks
          path: composeApp/build/reports/tests/
          retention-days: 14

  ios:
    # Kotlin/Native 2.2.21 targets Xcode 26.0.1; macos-15 is ARM64.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      IOS_SIMULATOR_RUNTIME_VERSION_PREFIX: '26.0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Check Apple toolchain
        run: |
          mkdir -p build/ios
          uname -m | tee build/ios/runner-architecture.txt
          test "$(uname -m)" = arm64
          xcodebuild -version | tee build/ios/xcode-version.txt
          grep -Fx 'Xcode 26.0.1' build/ios/xcode-version.txt
          xcodebuild -showsdks | tee build/ios/xcode-sdks.txt
          xcrun simctl list runtimes -j > build/ios/simulator-runtimes.json
          xcrun simctl list devicetypes -j > build/ios/simulator-device-types.json
          xcrun simctl list devices available -j > build/ios/simulator-devices.json
          plutil -lint iosApp/iosApp/Info.plist iosApp/iosApp.xcodeproj/project.pbxproj
      - name: Test shared Kotlin on iOS simulator
        run: gradle :composeApp:iosSimulatorArm64Test --stacktrace
      - name: Test SwiftUI host on iPhone and iPad and capture screenshots
        run: bash tools/smoke-ios.sh
      - name: Build unsigned device archive
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/ios/DuolingoKmpApp-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
          python3 tools/verify_bundled_audio.py --ios-app build/ios/DuolingoKmpApp-unsigned.xcarchive/Products/Applications/DuolingoKmpApp.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/DuolingoKmpApp-unsigned.xcarchive build/ios/DuolingoKmpApp-unsigned.xcarchive.zip
      - name: Upload simulator app and unsigned archive
        uses: actions/upload-artifact@v7
        with:
          name: DuolingoKmpApp-iOS-builds
          path: |
            build/ios/*simulator.zip
            build/ios/*.xcarchive.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iOS-checks
          path: |
            build/ios/*.png
            build/ios/*.xcresult
            build/ios/*.json
            build/ios/*.txt
            build/ios/*.tsv
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          retention-days: 14
