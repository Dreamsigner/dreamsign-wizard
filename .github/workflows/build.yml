name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Keep platform evidence from a running build while the next batch queues.
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate source coverage and generated curriculum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-PythonCheck { & python @args; if ($LASTEXITCODE -ne 0) { throw 'Python check failed.' } }
          Invoke-PythonCheck -m pip install sympy==1.12
          Invoke-PythonCheck -m unittest discover -s tools -p 'test_*.py'
          Invoke-PythonCheck tools/check_calculus_math.py
          Invoke-PythonCheck tools/check_linear_algebra_math.py
          Invoke-PythonCheck tools/check_missing_semester_scenarios.py
          Invoke-PythonCheck tools/check_intro_python.py
          Invoke-PythonCheck tools/check_discrete_math.py
          Invoke-PythonCheck tools/check_computation_theory.py
          Invoke-PythonCheck tools/check_computer_architecture.py
          Invoke-PythonCheck tools/check_numerical_methods.py
          Invoke-PythonCheck tools/check_formal_logic.py
          Invoke-PythonCheck tools/check_algorithmic_game_theory.py
          Invoke-PythonCheck tools/validate_course_resources.py
          Invoke-PythonCheck tools/export_course_notes.py --check
          Invoke-PythonCheck tools/validate_curriculum.py --generate
          git diff --exit-code -- composeApp/src/commonMain/kotlin/com/duolingo/app/data/generated/ docs/curriculum/AUTHORED-COVERAGE.md
          if ($LASTEXITCODE -ne 0) { throw 'Generated catalogue is stale.' }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Test and build Windows app image
        run: gradle :composeApp:desktopTest :composeApp:createDistributable --stacktrace
      - name: Prepare Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = Get-ChildItem 'composeApp/build/compose/binaries' -Filter 'DuolingoKmpApp.exe' -File -Recurse | Select-Object -First 1
          if (-not $launcher) { throw 'Windows app launcher was not produced.' }
          $runtimeRelease = Join-Path $launcher.Directory.FullName 'runtime/release'
          if (-not (Select-String -LiteralPath $runtimeRelease -SimpleMatch 'jdk.unsupported' -Quiet)) { throw 'PDFBox runtime module is missing.' }
          Get-ChildItem -LiteralPath 'docs/licences' -Filter '*.txt' -File | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $launcher.Directory.FullName $_.Name) }
          Copy-Item -LiteralPath 'docs/windows-testing.md' -Destination (Join-Path $launcher.Directory.FullName 'LISEZ-MOI.md')
          python tools/verify_bundled_audio.py --desktop-dir $launcher.Directory.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Bundled audio verification failed.' }
          $taskReport = Join-Path $PWD 'composeApp/build/reports/installation-check.json'
          $checkProcess = Start-Process -FilePath $launcher.FullName -ArgumentList @('--self-check', '--report', ('"{0}"' -f $taskReport)) -PassThru -WindowStyle Hidden
          if (-not $checkProcess.WaitForExit(60000)) {
            $checkProcess.Kill()
            throw 'The packaged installation check timed out.'
          }
          if ($checkProcess.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $taskReport)) { throw 'The packaged installation check failed.' }
          $checks = Get-Content -Raw -LiteralPath $taskReport | ConvertFrom-Json
          if ($checks.courses -lt 1 -or $checks.lessons -lt 1 -or $checks.exercises -lt 1 -or $checks.uiStarted -ne $false -or $checks.userDataAccessed -ne $false) { throw 'Invalid installation report.' }
          if ($checks.mathRenderingVerified -ne $true -or $checks.pdfRenderingVerified -ne $true) { throw 'The distributed document engines failed verification.' }
          Compress-Archive -Path (Join-Path $launcher.Directory.FullName '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'DuolingoKmpApp-Windows.zip')
      - name: Verify native WebView2 video playback
        env:
          ATELIER_VIDEO_REMOTE_SMOKE: "true"
          WEBVIEW2_USER_DATA_FOLDER: "${{ runner.temp }}\\atelier-video-webview2"
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: "--disable-backgrounding-occluded-windows --disable-renderer-backgrounding"
        shell: pwsh
        run: |
          gradle :composeApp:desktopVideoNativeTest --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Native video playback failed.' }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gradle :composeApp:packageExe --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          $setupDir = Join-Path $env:RUNNER_TEMP 'windows-setup'
          New-Item -ItemType Directory -Path $setupDir -Force | Out-Null
          $source = 'composeApp/build/compose/binaries/main/exe/DuolingoKmpApp-1.9.0.exe'
          $setup = Join-Path $setupDir 'AtelierApprentissage-1.9.0-Setup.exe'
          Copy-Item -LiteralPath $source -Destination $setup
          New-Item -ItemType Directory -Path 'composeApp/build/installer-fixtures' -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination 'composeApp/build/installer-fixtures/1.9.0.exe'
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AtelierApprentissage-1.9.0-Setup.exe" | Set-Content -LiteralPath (Join-Path $setupDir 'SHA256SUMS.txt') -Encoding ascii
      - name: Verify installation, upgrade and uninstall on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Build an unpublished, newer package solely to test the stable upgrade identity.
          gradle :composeApp:packageExe '-PdesktopPackageVersion=1.9.1' --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade fixture build failed.' }
          ./tools/test_windows_installer.ps1 -Installer 'composeApp/build/installer-fixtures/1.9.0.exe' -UpgradeInstaller 'composeApp/build/compose/binaries/main/exe/DuolingoKmpApp-1.9.1.exe' -ExpectedVersion '1.9.0' -ExpectedUpgradeVersion '1.9.1'
      - uses: actions/upload-artifact@v7
        with:
          name: AtelierApprentissage-Windows-Setup
          path: ${{ runner.temp }}/windows-setup/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: DuolingoKmpApp-Windows
          path: ${{ runner.temp }}\DuolingoKmpApp-Windows.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Windows-checks
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/desktopTest/
            composeApp/build/test-results/desktopVideoNativeTest/
            composeApp/build/reports/ui-snapshots/
            composeApp/build/reports/installation-check.json
            composeApp/build/reports/fraction-coverage/
            composeApp/build/reports/installer/
            composeApp/build/reports/native-video/
          retention-days: 14


  publish-windows-release:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.9.0' && needs.package-windows.result == 'success'
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Verify stable release tag and source commit
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          EXPECTED_VERSION: 1.9.0
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$TAG_NAME" != "v$EXPECTED_VERSION" ]]; then
            echo "Refusing to publish unexpected version tag: $TAG_NAME" >&2
            exit 1
          fi
          checked_out_commit="$(git rev-parse HEAD)"
          tagged_commit="$(git rev-parse "$TAG_NAME^{commit}")"
          if [[ "$checked_out_commit" != "$EXPECTED_COMMIT" || "$tagged_commit" != "$EXPECTED_COMMIT" ]]; then
            echo 'The release tag does not resolve to the workflow source commit.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: AtelierApprentissage-Windows-Setup
          path: ${{ runner.temp }}/windows-setup
      - name: Publish Windows installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: 1.9.0
          ASSET_DIR: ${{ runner.temp }}/windows-setup
        shell: bash
        run: |
          set -euo pipefail
          installer="$ASSET_DIR/AtelierApprentissage-$VERSION-Setup.exe"
          checksums="$ASSET_DIR/SHA256SUMS.txt"
          test -f "$installer"
          test -f "$checksums"
          if [[ "$(find "$ASSET_DIR" -maxdepth 1 -type f | wc -l)" -ne 2 ]]; then
            echo 'Unexpected files in Windows release artifact.' >&2
            exit 1
          fi
          (cd "$ASSET_DIR" && sha256sum --check SHA256SUMS.txt)
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<'NOTES'
          ## Atelier Apprentissage 1.9.0

          This release includes the Windows installer for Atelier Apprentissage.

          Video playback resumes from the last saved position for YouTube and MP4. Finished videos start again from the beginning. YouTube videos can be downloaded with an existing French audio track, including an automatic dub when available; no English audio is substituted. Downloading requires yt-dlp, FFmpeg and a supported JavaScript runtime on the computer.

          The new Settings section brings together the application version, automatic update controls, and local backup information. The navigation badge highlights an update ready to install or an error that needs attention.

          Download `AtelierApprentissage-1.9.0-Setup.exe` and run it to install the application. Existing learner progress is preserved during upgrades.

          `SHA256SUMS.txt` contains the SHA-256 checksum for the installer.
          NOTES
          gh release create "$TAG_NAME" "$installer" "$checksums" \
            --title "Atelier Apprentissage $VERSION" \
            --notes-file "$notes_file"
